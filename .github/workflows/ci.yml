name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manifest
          POSTGRES_PASSWORD: manifest
          POSTGRES_DB: manifest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manifest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests with coverage (core/ must stay >= 85%)
        run: pytest --cov=core --cov-report=term-missing --cov-fail-under=85

      - name: Postgres integration tests (backend/db_postgres.py)
        # DATABASE_URL is scoped to this step only, not the job -- the step
        # above must keep exercising the DuckDB path exactly as before,
        # with zero risk of a leaked env var silently switching what it tests.
        env:
          DATABASE_URL: postgresql://manifest:manifest@localhost:5432/manifest
        run: pytest tests/test_db_postgres.py -v

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Smoke test -- full pipeline against data/demo/, --no-llm, invariant must hold
        run: python -m scripts.smoke_test

      - name: Build the container image (catches Dockerfile rot; not pushed anywhere)
        run: docker build -t manifest .
